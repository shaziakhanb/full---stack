[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [".venv", ".deps", ".git", "__pycache__", "alembic"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
